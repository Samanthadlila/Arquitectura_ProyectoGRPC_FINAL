services:
  backend:
    build: ./backend
    container_name: food-del-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: food-del-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin:
    build: ./admin
    container_name: food-del-admin
    ports:
      - "5174:5174"
    depends_on:
      - backend
      